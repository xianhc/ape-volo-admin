<!DOCTYPE html>
<html lang="zh-cn" class="transition-colors">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      content="Ape,Volo,ApeVolo,Vue,Admin.Ape-Volo-Admin,ape-volo-admin,中后台管理权限框架,vue中后台管理权限框架,ape-volo-admin文档,ape-volo-admin首页"
      name="keywords"
    />
    <link rel="icon" href="/favicon.ico" />
    <title></title>
    <script>
      // 在应用接管主题前读取相同的偏好，避免夜间首屏闪白。
      ;(() => {
        const root = document.documentElement
        let mode = 'auto'
        try {
          const storedMode = localStorage.getItem('vueuse-color-scheme')
          if (['auto', 'dark', 'light'].includes(storedMode)) mode = storedMode
        } catch {
          // 存储不可用时跟随系统主题。
        }
        try {
          const parsed = JSON.parse(localStorage.getItem('sysPreferences'))
          const preferences =
            parsed && typeof parsed.version === 'number' && 'value' in parsed
              ? parsed.value
              : parsed
          if (preferences && typeof preferences === 'object') {
            if (['auto', 'dark', 'light'].includes(preferences.darkMode)) {
              mode = preferences.darkMode
            }
            if (/^#[\da-f]{6}$/i.test(preferences.primaryColor)) {
              root.style.setProperty('--el-color-primary', preferences.primaryColor)
            }
          }
        } catch {
          // 损坏的偏好不影响首屏展示，沿用上面的主题回退。
        }
        const dark =
          mode === 'dark' ||
          (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        root.classList.toggle('dark', dark)
        root.classList.toggle('light', !dark)
      })()
    </script>
    <style>
      .transition-colors {
        transition-property: color, background-color, border-color,
          text-decoration-color, fill, stroke;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        transition-duration: 150ms;
      }
      body {
        margin: 0;
      }
      #loading-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        height: 100vh;
        height: 100dvh;
        width: 100%;
        background: var(--app-canvas, #f1f3f6);
        color: var(--app-text-primary, #323639);
        font-family: var(--app-font-sans, 'Segoe UI', 'Microsoft YaHei', sans-serif);
        color-scheme: light;
      }
      .dark #loading-box {
        background: var(--app-canvas, #14161a);
        color: var(--app-text-primary, #f2f2f2);
        color-scheme: dark;
      }
      #loading-text {
        text-align: center;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.025em;
      }
      #loading {
        display: grid;
        grid-template-columns: repeat(2, 32px);
        grid-template-rows: repeat(2, 32px);
        gap: 7px;
        margin: 15px;
        transform: rotate(-45deg);
        perspective: 220px;
      }
      .loading-tile {
        background: var(--el-color-primary, #006be6);
        border-radius: 7px;
        transform-origin: 100% 100%;
        animation: loading-fold 2.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .loading-tile:nth-child(2) {
        opacity: 0.7;
        animation-delay: 0.14s;
        transform-origin: 0 100%;
      }
      .loading-tile:nth-child(3) {
        opacity: 0.45;
        animation-delay: 0.42s;
        transform-origin: 100% 0;
      }
      .loading-tile:nth-child(4) {
        opacity: 0.85;
        animation-delay: 0.28s;
        transform-origin: 0 0;
      }
      @keyframes loading-fold {
        0%, 15%, 80%, 100% {
          transform: rotateX(0) rotateY(0) scale(1);
        }
        40%, 55% {
          transform: rotateX(80deg) rotateY(55deg) scale(0.72);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-tile {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="loading-box" role="status" aria-label="Ape-Volo-Admin">
      <div id="loading" aria-hidden="true">
        <div class="loading-tile"></div>
        <div class="loading-tile"></div>
        <div class="loading-tile"></div>
        <div class="loading-tile"></div>
      </div>
      <div id="loading-text">Ape-Volo-Admin</div>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
